services:

  db:
    image: pgautoupgrade/pgautoupgrade:13-alpine
    container_name: label_studio_db
    hostname: db
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-p", "5432", "-U", "postgres", "-d", "postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3

  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: label_studio
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./data/label-studio-data:/label-studio/data
    command:
      - label-studio
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db

  minio:
    image: minio/minio:latest
    container_name: label_studio_s3
    restart: always
    command: server --console-address ":9001" /data/
    ports:
      - "9000:9000" # api
      - "9001:9001"  #web
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password1234
    volumes:
      - ./s3_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3