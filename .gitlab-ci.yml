stages:
  - build
  - validation
  - deploy

build-job:
  stage: build
  script:
    - pip install -r requirements.txt


lint-pylint-job:
  stage: validation
  script:
    - echo "Linting code by pylint...."
    - pylint . || exit 1
    - echo "Pylint linter passed."

lint-ruff-job:
  stage: validation
  script:
    - echo "Linting code by ruff..."
    - ruff check
    - echo "Ruff linter passed."

deploy-job:
  stage: deploy
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
