global:
  scrape_interval: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "model_service_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["model_service_api:8001"]

  - job_name: "business_service_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["business_service_api:8002"]
